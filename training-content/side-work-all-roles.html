<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Side Work &amp; Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Rally palette */
  --deep:#174854; --olive:#4e622c; --orange:#f89a1c; --cream:#fbf6ed; --coral:#f58664; --mint:#cee4cf;
  --bg:var(--cream); --surface:var(--cream); --ink:var(--deep); --ink-soft:#4b6d75;
  --rule:var(--deep); --line:#d9dccf; --check:var(--olive); --done:#8fa3a7; --chip:var(--mint); --chip-ink:var(--deep);
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Hanken Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
  --hand:'Gochi Hand','Marker Felt','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e2b33; --surface:#123a44; --ink:#fbf6ed; --ink-soft:#b9cdd0;
    --rule:#5d8790; --line:#24525d; --check:var(--mint); --done:#6f9097; --chip:#1d5361; --chip-ink:#fbf6ed;
  }
}
:root[data-theme="dark"]{
  --bg:#0e2b33; --surface:#123a44; --ink:#fbf6ed; --ink-soft:#b9cdd0;
  --rule:#5d8790; --line:#24525d; --check:var(--mint); --done:#6f9097; --chip:#1d5361; --chip-ink:#fbf6ed;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* illustrations: alpha masks tinted with the current ink color */
.ill{display:block;background:var(--ink);-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat;aspect-ratio:var(--ar)}

/* ---------- page frame ---------- */
.page{max-width:1180px;margin:0 auto;padding:18px 24px 80px}
.topbar{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 14px}
.hand{font-family:var(--hand);text-transform:uppercase;letter-spacing:.12em;font-size:22px;line-height:1}
.frame{border:2px solid var(--rule)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.hero-title{border-right:2px solid var(--rule);display:grid;grid-template-rows:auto auto}
.hero-title .t{padding:56px 40px 44px;border-bottom:2px solid var(--rule)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(64px,9vw,118px);line-height:.88;margin:0;letter-spacing:-.01em}
h1 em,h2 em{display:block;font-style:italic}
.hero-title p{margin:0;padding:32px 40px 40px;max-width:30em;font-size:17px}
.hero-art{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:32px 40px;min-height:340px}
.hero-art .script{width:100%}
.hero-art .players{width:100%}

/* body grid */
.body{display:grid;grid-template-columns:230px minmax(0,1fr);border-top:0}
nav.roles{border-right:2px solid var(--rule);padding:28px 0}
.navwrap{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
nav.roles .hand{font-size:17px;padding:0 24px 12px;display:block;color:var(--ink-soft)}
nav.roles ul{list-style:none;margin:0;padding:0}
nav.roles button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 24px;font-size:16px;font-weight:500;cursor:pointer;color:var(--ink-soft)}
nav.roles li:last-child button{border-bottom:1px solid var(--line)}
nav.roles button:hover{color:var(--ink)}
nav.roles button[aria-current="true"]{background:var(--chip);color:var(--chip-ink);font-weight:700}
nav.roles .pct{font-size:13px;font-weight:600;color:var(--olive)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.roles .pct{color:var(--mint)}}
:root[data-theme="dark"] nav.roles .pct{color:var(--mint)}
main{padding:40px 44px 64px;min-width:0}

/* position header */
.pos-head{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:28px;align-items:end;padding-bottom:28px;border-bottom:2px solid var(--rule)}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6vw,72px);line-height:.9;margin:0 0 16px}
.pos-head p{margin:0;color:var(--ink-soft);max-width:34em}
.pos-head .ill{width:100%;max-height:200px}
.meta{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:22px}
.initials{display:flex;align-items:center;gap:10px;font-size:15px}
.initials input{width:76px;padding:7px 10px;border:2px solid var(--rule);border-radius:0;background:var(--surface);font-family:var(--hand);font-size:20px;text-transform:uppercase;letter-spacing:.1em;line-height:1}
.tools{display:flex;gap:8px}
.btn{border:2px solid var(--rule);background:none;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}

.first{margin:28px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start;background:var(--deep);color:var(--cream);padding:20px 24px}
.first .hand{font-size:18px;color:var(--orange);padding-top:3px}
.first ul{margin:0;padding-left:18px}

.phases{display:flex;margin:32px 0 0;border:2px solid var(--rule);overflow-x:auto}
.phases button{flex:1;background:none;border:0;border-right:2px solid var(--rule);padding:12px 14px;font-size:16px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.phases button:last-child{border-right:0}
.phases button[aria-selected="true"]{background:var(--deep);color:var(--cream);font-weight:700}
.phases .n{font-size:13px;margin-left:6px;opacity:.75}

.progress{display:flex;align-items:center;gap:14px;margin:18px 0 0}
.bar{flex:1;height:6px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .3s ease}
.progress .count{font-family:var(--serif);font-size:24px;min-width:64px;text-align:right}

.group{margin-top:30px}
.group h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:26px;line-height:1.1;margin:0;padding-bottom:8px;border-bottom:2px solid var(--rule)}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--rule);display:grid;place-content:center;cursor:pointer;background:var(--surface)}
.item input:checked{background:var(--check);border-color:var(--check)}
.item input:checked::after{content:"";width:6px;height:12px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.done .t{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;margin-left:6px;vertical-align:1px;background:var(--chip);color:var(--chip-ink)}
.tag.time{background:var(--orange);color:var(--deep)}
.stamp{font-family:var(--hand);font-size:19px;line-height:1.2;color:var(--olive);white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{color:var(--mint)}}
:root[data-theme="dark"] .stamp{color:var(--mint)}
.note{margin-top:28px;font-size:15px;color:var(--ink-soft);border-left:4px solid var(--coral);padding:4px 0 4px 14px}

/* start here */
.basics h3.big{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;margin:44px 0 12px}
.basics h3.big em{font-style:italic}
.basics p{max-width:36em}

.lead{margin:22px 0 0;background:var(--mint);color:var(--deep);padding:14px 18px;font-weight:600}
.script{margin:12px 0 4px 40px;border-left:3px solid var(--orange);padding:4px 0 4px 16px}
.script .hand{font-size:16px;color:var(--ink-soft);display:block;margin-bottom:4px}
.script p{margin:0 0 6px;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.3}
.script ul{margin:4px 0 0;padding-left:18px}
.draft{margin-top:22px;border:2px dashed var(--coral);padding:12px 16px;font-size:15px}
.guide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;margin-top:28px;border:2px solid var(--rule)}
.guide .intro{grid-column:1 / -1;padding:20px 22px;border-bottom:2px solid var(--rule);font-size:18px;line-height:1.55;margin:0}
.guide section{padding:18px 22px}
.guide section+section{border-left:2px solid var(--rule)}
.guide h4{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 8px}
.guide h4 em{font-style:italic}
.guide ul{margin:0;padding-left:18px}
.guide li{margin-bottom:6px}
.gnote{margin:10px 0 4px;color:var(--ink-soft);font-size:15.5px;max-width:46em}
.printall{margin-top:28px}
@media (max-width:820px){.guide{grid-template-columns:minmax(0,1fr)}.guide section+section{border-left:0;border-top:2px solid var(--rule)}}
#printSheet{display:none}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .page{padding:14px 14px 56px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-title{border-right:0;border-bottom:2px solid var(--rule)}
  .hero-title .t{padding:36px 24px 28px}
  .hero-title p{padding:22px 24px 26px}
  .hero-art{min-height:0;padding:22px 24px}
  .body{grid-template-columns:minmax(0,1fr)}
  nav.roles{border-right:0;border-bottom:2px solid var(--rule);padding:0;position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
  .navwrap{position:static}
  nav.roles .hand{display:none}
  nav.roles ul{display:flex;overflow-x:auto}
  nav.roles button,nav.roles li:last-child button{border:0;border-right:1px solid var(--line);white-space:nowrap;padding:12px 16px}
  main{padding:28px 18px 48px}
  .pos-head{grid-template-columns:minmax(0,1fr) 96px;gap:14px}
  .first{grid-template-columns:minmax(0,1fr);gap:8px}
  .script{margin-left:8px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* ---------- print ---------- */
@page{size:letter;margin:0.55in 0.6in}
@media print{
  :root{padding:0;--ink:#174854;--bg:#fff}
  html,body{background:#fff;color:#174854;font-size:10.5pt;line-height:1.45}
  .page{display:none!important}
  #printSheet{display:block}
  #printSheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp{break-before:page;page-break-before:always}
  .pp.first-page{break-before:auto;page-break-before:auto}
  .run{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #174854;padding-bottom:4pt;margin-bottom:14pt}
  .run .hand{font-size:12pt}
  .ptitle{display:grid;grid-template-columns:1fr 1.6in;gap:16pt;align-items:end;margin-bottom:12pt}
  .ptitle h1{font-family:var(--serif);font-weight:400;font-size:44pt;line-height:.9;margin:0}
  .ptitle h1 em{display:block;font-style:italic}
  .ptitle img{width:100%;max-height:1.7in;object-fit:contain}
  .pintro{font-size:12pt;line-height:1.5;margin:0 0 14pt;border-top:1.5pt solid #174854;border-bottom:1.5pt solid #174854;padding:10pt 0}
  .pcols{display:grid;grid-template-columns:1fr 1fr;gap:18pt}
  .pcols h3,.pp h2.ph{font-family:var(--serif);font-weight:400}
  .pcols h3{font-size:17pt;margin:0 0 6pt}
  .pcols ul{margin:0;padding-left:14pt}
  .pcols li{margin-bottom:4pt}
  h2.ph{font-size:30pt;margin:0 0 4pt;line-height:1}
  .plead{background:#cee4cf;padding:6pt 9pt;font-weight:600;margin:6pt 0 8pt}
  .pg{margin:12pt 0 0}
  .pg h3,.pg .pn,.pg th{break-after:avoid;page-break-after:avoid}
  .pg h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:15pt;margin:0;padding-bottom:3pt;border-bottom:1pt solid #174854}
  .pg .pn{margin:4pt 0 5pt;color:#3d5f67;font-size:9.5pt}
  .pg table{width:100%;border-collapse:collapse}
  .pg td{border-bottom:.6pt solid #b9c7c5;padding:4.5pt 4pt;vertical-align:top}
  .pg td.b{width:14pt}
  .pg td.b span{display:inline-block;width:9pt;height:9pt;border:1pt solid #174854;margin-top:2pt}
  .pg td.i{width:62pt;border-left:.6pt solid #b9c7c5}
  .pg tr{break-inside:avoid}
  .pg .tag{font-size:8pt;font-weight:700;padding:0 4pt;background:#cee4cf;color:#174854;margin-left:3pt}
  .pg .tag.time{background:#f89a1c}
  .pg th{font-size:8pt;text-align:left;font-weight:600;color:#3d5f67;padding:0 4pt 2pt}
  .pscript{margin:6pt 0 0 18pt;border-left:2pt solid #f89a1c;padding-left:8pt;font-size:10pt}
  .pscript p{font-family:var(--serif);font-style:italic;font-size:12pt;margin:0 0 3pt}
  .pnote{margin-top:12pt;border-left:3pt solid #f58664;padding-left:8pt;font-size:9.5pt}
  .pdraft{border:1.5pt dashed #f58664;padding:6pt 8pt;font-size:9.5pt;margin-bottom:10pt}
  #printSheet img{max-width:100%;height:auto}
  .pfoot{break-before:avoid;page-break-before:avoid;margin-top:14pt;font-size:8.5pt;color:#3d5f67}
  .cover{height:9.6in;display:flex;flex-direction:column;justify-content:space-between}
  .cover h1{font-family:var(--serif);font-weight:400;font-size:72pt;line-height:.88;margin:0}
  .cover h1 em{display:block;font-style:italic}
  .cover .art{display:grid;grid-template-columns:1fr 1fr;gap:20pt;align-items:center}
  .cover .art img{width:100%}
  .cover ol{font-family:var(--serif);font-size:16pt;padding-left:20pt;margin:0}
  .pbasics h3{font-family:var(--serif);font-weight:400;font-size:20pt;margin:16pt 0 4pt}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><span class="hand">Training guide</span><span class="hand">Rally</span></div>

  <header class="hero frame">
    <div class="hero-title">
      <div class="t"><h1>Side <em>Work</em></h1></div>
      <p>The training guide for every front-of-house role at Rally: what each role is responsible for, why each task matters, and the full side work checklist. Use it on screen during a shift, or print it for the venue.</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <span class="ill script" data-ill="script"></span>
      <span class="ill players" data-ill="players"></span>
    </div>
  </header>

  <div class="body frame" style="border-top:0">
    <nav class="roles" aria-label="Positions"><div class="navwrap"><span class="hand">Positions</span><ul id="roleList"></ul></div></nav>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div id="printSheet"></div>

    "downtime|Task 3: Respond to emails":"Nothing waits on a reply. Copy the GM so there’s a record, and use AI to tighten up the grammar before you send."
  }
},
swarmer:{
  intro:"Swarmers keep Rally guest-ready. You make continuous laps around the venue so tables, lounges and courts are always clean and stocked, which lets Captains and Bartenders focus on guests.",
  great:[
    "Your laps never stop: sweep, wipe, bus and reset as you go.",
    "Dirty dishes never sit. Run them to the kitchen throughout the shift.",
    "Waters and cold towels stay full in the lounges, at the café water station and outside.",
    "Broken glass is discarded immediately."],
  tips:[
    "If you see a facility issue, like a wobbly table or a burnt-out bulb, tell management.",
    "Get your closing checkout signed by the lead captain before checking out with the MOD."],
  notes:{
    "opening|Opening":"Help the Captains open: flip the bin carts, stock captains’ quarters and set up the outside lounges.",
    "running|During shift":"Laps are the job. Every lap, sweep, wipe, bus and reset. Refill rolls in the pizza kitchen and C4 captains’ quarters as needed.",
    "closing|Closing":"Help Captains finish the dining room, stock captains’ quarters to par and roll silverware to the count your lead captain or MOD gives you. Make sure all handhelds are accounted for and charging."
  }
},
lead:{
  intro:"The Team Lead runs the shift: sets the team up, walks the floor, handles guest recovery and makes sure every checklist is done before anyone leaves.",
  great:[
    "Every opening and closing checklist is complete before the team is released.",
    "Guest issues are handled quickly, with the right recovery.",
    "The next shift has clear notes on sales, comps, incidents, 86s and maintenance."],
  tips:["Check each person’s side work before releasing them."],
  notes:{}
}
};

const ART={barista:"cup",bartender:"coupe",captain:"beer",host:"umbrella",swarmer:"paddle",lead:"players",basics:"crowd"};

function paintIll(root){
  (root||document).querySelectorAll("[data-ill]").forEach(el=>{
    const d=ILL[el.dataset.ill]; if(!d) return;
    el.style.setProperty("--src",`url("${d.uri}")`);
    el.style.setProperty("--ar",`${d.w} / ${d.h}`);
  });
}

/* state (per viewer, resets each day) */
const today=new Date().toISOString().slice(0,10);
const KEY="rally-sidework-"+today;
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}
let initials="";
try{initials=localStorage.getItem("rally-initials")||""}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

let current="basics", phase="opening";
const txt=i=>typeof i==="string"?i:i.t;
const idFor=(p,ph,gi,ii)=>`${p}.${ph}.${gi}.${ii}`;
function counts(p,ph){
  let total=0,done=0;
  p.phases.filter(x=>!ph||x.key===ph).forEach(P=>P.groups.forEach((g,gi)=>g.items.forEach((_,ii)=>{total++; if(state[idFor(p.id,P.key,gi,ii)]) done++;})));
  return {total,done};
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function splitName(n){ // "Captain / Server" -> roman first part, italic rest
  const parts=n.split(" / ");
  return parts.length>1?`${parts[0]} <em>${parts.slice(1).join(" ")}</em>`:`${n} <em>side work</em>`;
}

function renderNav(){
  const ul=document.getElementById("roleList");
  let h=`<li><button data-id="basics" aria-current="${current==="basics"}">Start here</button></li>`;
  POSITIONS.forEach(p=>{
    const c=counts(p); const pct=c.done?Math.round(c.done/c.total*100)+"%":"";
    h+=`<li><button data-id="${p.id}" aria-current="${current===p.id}"><span>${p.name}</span><span class="pct">${pct}</span></button></li>`;
  });
  ul.innerHTML=h;
  ul.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    current=b.dataset.id;const P=POSITIONS.find(x=>x.id===current);phase=P?P.phases[0].key:"";render();
    document.getElementById("main").focus({preventScroll:true});
    const top=document.querySelector(".body").getBoundingClientRect().top+window.scrollY;
    if(window.scrollY>top) window.scrollTo({top,behavior:"smooth"});
  });
}

function renderBasics(){
  return `<section class="basics">
  <div class="pos-head">
    <div><h2>Start <em>here</em></h2>
    <p>Rally exists to be a catalyst for connection. Side work is how we keep the building ready for that, every shift, so you can spend your attention on guests.</p></div>
    <span class="ill" data-ill="crowd" aria-hidden="true"></span>
  </div>

  <h3 class="big">Magic <em>Moments</em></h3>
  <p>Small acts of service where we go above and beyond what was expected. Anticipating needs, solving problems before guests notice them, and creating the moment a guest’s face lights up and becomes a story they tell their friends. Clean, stocked, ready stations are what give you the time to create them.</p>

  <h3 class="big">How side work <em>works</em></h3>
  <p>Pick your position. Each one opens with an overview of the role, then the side work for each part of the shift, with a note on why each station matters. Type your initials once, then tap each task as you finish it. Your initials and the time are stamped next to it, just like the paper sheet. Lists reset automatically each day and are saved on the device you’re using.</p>
  <p>If something can’t be done (out of product, broken equipment), tell your Team Lead before you leave. The Team Lead checks every list before releasing the team.</p>
  <button class="btn printall" id="printAll">Print the full guide</button>
  </section>`;
}

function renderPosition(p){
  const P=p.phases.find(x=>x.key===phase)||p.phases[0]; phase=P.key;
  const c=counts(p,phase);
  let h=`<div class="pos-head">
    <div><h2>${splitName(p.name)}</h2><p>${p.role}</p>
    <div class="meta">
      <label class="initials">Your initials <input id="ini" maxlength="4" value="${esc(initials)}" autocomplete="off"></label>
      <div class="tools"><button class="btn" id="printBtn">Print this guide</button><button class="btn" id="resetBtn">Clear list</button></div>
    </div></div>
    <span class="ill" data-ill="${ART[p.id]}" aria-hidden="true"></span>
  </div>`;
  if(p.draft) h+=`<p class="draft">Draft list. There’s no Team Lead side work document yet, so review and edit these tasks before using them.</p>`;
  const G=GUIDE[p.id]||{};
  if(G.intro) h+=`<div class="guide"><p class="intro">${G.intro}</p><section><h4>What great <em>looks like</em></h4><ul>${(G.great||[]).map(x=>`<li>${x}</li>`).join("")}</ul></section><section><h4>Good <em>habits</em></h4><ul>${(G.tips||[]).map(x=>`<li>${x}</li>`).join("")}</ul></section></div>`;
  if(p.first&&p.first.length) h+=`<div class="first"><span class="hand">First thing</span><ul>${p.first.map(f=>`<li>${f}</li>`).join("")}</ul></div>`;
  h+=`<div class="phases" role="tablist">`+p.phases.map(x=>{
    const cc=counts(p,x.key);
    return `<button role="tab" data-ph="${x.key}" aria-selected="${phase===x.key}">${x.label}<span class="n">${cc.done}/${cc.total}</span></button>`;
  }).join("")+`</div>`;
  if(P.lead) h+=`<p class="lead">${P.lead}</p>`;
  h+=`<div class="progress"><div class="bar"><i style="width:${c.total?c.done/c.total*100:0}%"></i></div><span class="count">${c.done}/${c.total}</span></div>`;
  P.groups.forEach((g,gi)=>{
    const gn=(G.notes||{})[P.key+"|"+g.g];
    h+=`<div class="group"><h3>${g.g}</h3>${gn?`<p class="gnote">${gn}</p>`:""}`;
    g.items.forEach((it,ii)=>{
      const id=idFor(p.id,P.key,gi,ii), s=state[id];
      const tag=typeof it==="object"&&it.tag?`<span class="tag">${it.tag}</span>`:"";
      const tm=typeof it==="object"&&it.time?`<span class="tag time">by ${it.time}</span>`:"";
      h+=`<label class="item${s?" done":""}"><input type="checkbox" data-id="${id}"${s?" checked":""}><span><span class="t">${txt(it)}</span>${tag}${tm}</span><span class="stamp">${s?esc(s):""}</span></label>`;
    });
    if(g.script) h+=`<div class="script"><span class="hand">Script</span>${g.script.map(l=>`<p>${l}</p>`).join("")}${g.ask?`<span class="hand" style="margin-top:10px">Ask</span><ul>${g.ask.map(a=>`<li>${a}</li>`).join("")}</ul>`:""}</div>`;
    h+=`</div>`;
  });
  if(P.note) h+=`<p class="note">${P.note}</p>`;
  return h;
}

function bindPosition(p){
  document.getElementById("ini").oninput=e=>{initials=e.target.value.toUpperCase();e.target.value=initials;try{localStorage.setItem("rally-initials",initials)}catch(_){}};
  document.querySelectorAll(".phases button").forEach(b=>b.onclick=()=>{phase=b.dataset.ph;render()});
  document.querySelectorAll(".item input").forEach(cb=>cb.onchange=()=>{
    const id=cb.dataset.id;
    if(cb.checked){
      const t=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
      state[id]=(initials?initials+" ":"")+t;
    } else delete state[id];
    save(); render();
    const again=document.querySelector(`.item input[data-id="${CSS.escape(id)}"]`); if(again) again.focus({preventScroll:true});
  });
  document.getElementById("resetBtn").onclick=()=>{
    if(!confirm(`Clear today’s ${p.name} checklist?`)) return;
    Object.keys(state).forEach(k=>{if(k.startsWith(p.id+".")) delete state[k]}); save(); render();
  };
  document.getElementById("printBtn").onclick=()=>{buildPrint([p],false);window.print()};
}

const pimg=k=>ILL[k]?`<img src="${ILL[k].uri}" alt="">`:"";
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function printPosition(p,firstPage){
  const G=GUIDE[p.id]||{};
  let h=`<div class="pp${firstPage?" first-page":""}">
    <div class="run"><span class="hand">Training guide</span><span class="hand">Rally</span></div>
    <div class="ptitle"><h1>${splitName(p.name)}</h1>${pimg(ART[p.id])}</div>`;
  if(p.draft) h+=`<p class="pdraft">Draft list. There’s no Team Lead side work document yet, so review these tasks before using them.</p>`;
  if(G.intro) h+=`<p class="pintro">${G.intro}</p>`;
  h+=`<div class="pcols">`;
  if(G.great) h+=`<div><h3>What great <em>looks like</em></h3><ul>${G.great.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(G.tips) h+=`<div><h3>Good <em>habits</em></h3><ul>${G.tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  h+=`</div>`;
  if(p.first&&p.first.length) h+=`<div class="pg"><h3>When you first come in</h3><table>${p.first.map(f=>`<tr><td class="b"><span></span></td><td>${f}</td><td class="i"></td></tr>`).join("")}</table></div>`;
  h+=`</div>`;
  p.phases.forEach(P=>{
    h+=`<div class="pp"><div class="run"><span class="hand">${p.name}</span><span class="hand">Rally</span></div>
      <h2 class="ph">${P.label}</h2>`;
    if(P.lead) h+=`<p class="plead">${P.lead}</p>`;
    P.groups.forEach(g=>{
      const n=(G.notes||{})[P.key+"|"+g.g];
      h+=`<div class="pg"><h3>${cap(g.g)}</h3>${n?`<p class="pn">${n}</p>`:""}<table><tr><th></th><th>Task</th><th>Initials</th></tr>`;
      g.items.forEach(it=>{
        const tag=typeof it==="object"&&it.tag?`<span class="tag">${it.tag}</span>`:"";
        const tm=typeof it==="object"&&it.time?`<span class="tag time">by ${it.time}</span>`:"";
        h+=`<tr><td class="b"><span></span></td><td>${txt(it)}${tag}${tm}</td><td class="i"></td></tr>`;
      });
      h+=`</table>`;
      if(g.script) h+=`<div class="pscript">${g.script.map(l=>`<p>${l}</p>`).join("")}${g.ask?`<b>Ask:</b><ul style="margin:2pt 0 0;padding-left:14pt">${g.ask.map(a=>`<li>${a}</li>`).join("")}</ul>`:""}</div>`;
      h+=`</div>`;
    });
    if(P.note) h+=`<p class="pnote">${P.note}</p>`;
    h+=`<p class="pfoot">Initial each task as you finish it. If something can’t be done, tell your manager before you leave.</p></div>`;
  });
  return h;
}
function buildPrint(list,withCover){
  let h="";
  if(withCover){
    h+=`<div class="pp first-page cover">
      <div><div class="run"><span class="hand">Training guide</span><span class="hand">Rally</span></div>
      <h1>Side <em>Work</em></h1></div>
      <div class="art">${pimg("script")}${pimg("players")}</div>
      <div><p style="font-family:var(--hand);text-transform:uppercase;letter-spacing:.12em;font-size:13pt;margin:0 0 6pt">Contents</p>
      <ol><li>Start here</li>${list.map(p=>`<li>${p.name}</li>`).join("")}</ol></div></div>
      <div class="pp pbasics"><div class="run"><span class="hand">Start here</span><span class="hand">Rally</span></div>
      <h2 class="ph" style="font-family:var(--serif);font-weight:400">Start <em>here</em></h2>
      <p>Rally exists to be a catalyst for connection. Side work is how we keep the building ready for that, every shift, so you can spend your attention on guests.</p>
      <h3>Magic <em>Moments</em></h3>
      <p>Small acts of service where we go above and beyond what was expected. Anticipating needs, solving problems before guests notice them, and creating the moment a guest’s face lights up and becomes a story they tell their friends. Clean, stocked, ready stations are what give you the time to create them.</p>
      <h3>How to use this <em>guide</em></h3>
      <p>Each position starts with an overview of the role, what great looks like and good habits. The pages after that are the side work checklists, one page for each part of the shift, with a short note on why each station matters. Initial each task as you finish it.</p>
      <p>If something can’t be done (out of product, broken equipment), tell your manager before you leave. Managers check side work before releasing the team.</p>
      <div style="margin-top:18pt;width:1.8in">${pimg("crowd")}</div></div>`;
  }
  list.forEach((p,i)=>{h+=printPosition(p,!withCover&&i===0)});
  document.getElementById("printSheet").innerHTML=h;
}

function render(){
  renderNav();
  const m=document.getElementById("main");
  if(current==="basics"){m.innerHTML=renderBasics();document.getElementById("printAll").onclick=()=>{buildPrint(POSITIONS,true);window.print()};}
  else{const p=POSITIONS.find(x=>x.id===current); m.innerHTML=renderPosition(p); bindPosition(p);}
  paintIll(m);
}
paintIll(document.querySelector(".hero"));
render();
</script>
</body>
</html>
